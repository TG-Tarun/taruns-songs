name: Build Tarun's Songs APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      MORNYE_DISCORD_SDK: "0"
      MORNYE_RUST_ANDROID_ABIS: "arm64-v8a"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370" \
            "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

          
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "Disk space after cleanup:"
          df -h /


      - name: Setup Flutter pinned by project
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev clang cmake ninja-build pkg-config

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APK (Lite, arm64)
        run: bash scripts/build_android.sh --lite --target lib/main.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taruns-songs-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
